name: react-matrix-test

on:
  push:
    branches:
      - react-matrix-test
  pull_request:
    branches:
      - react-matrix-test
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]
        react-version: [ 18.3.1, 19.2.4 ]

    defaults:
      run:
        working-directory: ./react-tree-multi-select-isolated

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Copy library to isolated folder
        working-directory: .
        run: |
          mkdir react-tree-multi-select-isolated
          rsync -a --exclude node_modules packages/react-tree-multi-select/ react-tree-multi-select-isolated/

      - name: Install React from matrix
        run: |
          npm install
          npm uninstall react react-dom
          npm install react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}
          npm ls react react-dom

      - name: Run tests
        run: |
          npm run build
          npm test
