name: build-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  LIB_PATH: 'packages/react-tree-multi-select/'
  ISOLATED_PATH: './react-tree-multi-select-isolated'

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20.x, 22.x, 24.x ]
        react-version: [ 18.3.1, 19.2.4 ]

    defaults:
      run:
        working-directory: ${{ env.ISOLATED_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Copy library to isolated folder
        working-directory: .
        run: |
          mkdir ${{ env.ISOLATED_PATH }}
          rsync -a --exclude node_modules ${{ env.LIB_PATH }} ${{ env.ISOLATED_PATH }}

      - name: Install dependencies
        run: npm install

      - name: Use React from matrix
        run: |
          npm uninstall react react-dom
          npm install react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }} --legacy-peer-deps
          npm ls react react-dom

      - name: Build library
        run: npm run build

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ env.ISOLATED_PATH }}/coverage
